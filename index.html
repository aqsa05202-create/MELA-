<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mela – Share moments, watch reels</title>
<meta name="description" content="Mela: share posts, reels and videos with your community.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff8a00'/%3E%3Ctext x='32' y='47' font-size='40' text-anchor='middle' font-family='sans-serif' font-weight='800' fill='%232a1838'%3EM%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#2a1838;--mute:#7a6a85;--line:#eadfd0;--accent:#ff8a00;--teal:#0f8b7f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1024;--card:#261834;--ink:#f6ecff;--mute:#a995b8;--line:#3a2850;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1024;--card:#261834;--ink:#f6ecff;--mute:#a995b8;--line:#3a2850;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.03em}.logo i{font-style:normal;color:var(--accent)}
nav{display:flex;gap:4px;margin:0 auto}
nav button{padding:8px 16px;border-radius:99px;font-weight:600;color:var(--mute)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pill{background:var(--accent);color:#2a1838;font-weight:800;padding:9px 16px;border-radius:99px}
.ghost{border:1px solid var(--line);padding:8px 14px;border-radius:99px;font-weight:600}
main{max-width:640px;margin:0 auto;padding:16px}main.wide{max-width:1100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px}.ph b{display:block;line-height:1.1}.ph small{color:var(--mute)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.txt{padding:0 14px 12px;max-width:62ch;white-space:pre-wrap;overflow-wrap:anywhere}
.media{aspect-ratio:16/9;position:relative;overflow:hidden}
.art{position:absolute;inset:0}.art span{position:absolute;border-radius:50%;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(30px,-24px) scale(1.25)}}
.acts{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}
.acts button{padding:8px 12px;border-radius:10px;font-weight:600;color:var(--mute)}.acts button:hover{background:var(--line)}.acts .on{color:#e5195b}
.cmts{padding:8px 14px 14px;border-top:1px solid var(--line)}.cmts p{margin:6px 0;font-size:.95rem}
.cmts form{display:flex;gap:8px;margin-top:8px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.btn{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;white-space:nowrap}
.reels{height:calc(100dvh - 130px);overflow-y:auto;scroll-snap-type:y mandatory;border-radius:18px;max-width:420px;margin:0 auto;scrollbar-width:none}
.reel{height:100%;scroll-snap-align:start;position:relative;overflow:hidden;color:#fff}
.reel .cap{position:absolute;left:16px;right:80px;bottom:20px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.reel .side{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;gap:14px;align-items:center}
.reel .side button{color:#fff;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.vid{text-align:left;display:block;width:100%}.vid .media{border-radius:14px}.vid h3{margin:8px 0 2px;font-size:1rem}.vid small{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(20,8,30,.55)}dialog h2{margin:0 0 10px}dialog input,dialog textarea,dialog select{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:40;font-weight:600}
.media video,.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.reel video,.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
#bnav{display:none}
body.tt header,body.tt footer{display:none}body.tt main{padding:0;max-width:none}
.ttw{position:fixed;inset:0;background:#000;z-index:15}.ttw .reels{height:100%;max-width:480px;margin:0 auto;border-radius:0}
.tabs2{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:22px;z-index:3;color:#fff;font-weight:700}
.tabs2 button{opacity:.65;color:#fff;font-size:1.05rem;padding:4px 2px}.tabs2 button.on{opacity:1;border-bottom:2px solid #fff}
.shade{position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.7));z-index:1;pointer-events:none}
.reel video,.reel img{z-index:0}.reel .cap{z-index:2;left:12px;right:84px;bottom:22px}
.reel .side{z-index:2;right:8px;bottom:80px;gap:16px}.reel .side button{display:grid;justify-items:center;gap:2px;font-size:.78rem;font-weight:700;width:auto}
.side .ic{font-size:2rem;line-height:1}.side .liked .ic{color:#fe2c55}
.avb{position:relative;margin-bottom:10px}.avb .av{width:50px;height:50px;border:2px solid #fff}
.fplus{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#fe2c55;color:#fff;display:grid;place-items:center;font-size:1rem;line-height:1}
.sheet{margin:auto auto 0;width:100%;max-width:520px;border-radius:18px 18px 0 0}.sheet .btn{text-decoration:none;display:inline-block}
@media (max-width:700px){nav{display:none}body{padding-bottom:64px}.ttw{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
 #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#000;justify-content:space-around;align-items:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid #222}
 #bnav button{color:#aaa;font-size:.72rem;display:grid;justify-items:center;gap:0;padding:2px 10px}#bnav button span{font-size:1.3rem;line-height:1.2}
 #bnav button[aria-current="true"]{color:#fff;font-weight:700}
 #bnav .plus{background:linear-gradient(90deg,#25f4ee 0 28%,#fff 28% 72%,#fe2c55 72%);width:48px;height:32px;border-radius:9px;color:#000;font-weight:800;font-size:1.4rem;padding:0;display:grid;place-items:center}}
img.av{object-fit:cover}
.hero{background:linear-gradient(135deg,#2a1838,#5b3fd1 55%,#ff8a00);color:#fff;border-radius:22px;padding:34px 22px;margin-bottom:14px}
.hero h1{margin:0 0 8px;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;letter-spacing:-.03em}.hero p{margin:0 0 16px;opacity:.92;max-width:46ch}
.hero .ghost{border-color:rgba(255,255,255,.55);color:#fff}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.feats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:.88rem;color:var(--mute)}.feats b{display:block;color:var(--ink);font-size:1rem}
.cover{height:120px}.pbox{margin-top:-44px;padding:0 18px 18px}.pav{width:88px!important;height:88px!important;font-size:2rem;border:4px solid var(--card)}
.stats{display:flex;gap:18px;margin:10px 0;color:var(--mute)}.stats b{color:var(--ink)}
footer{max-width:640px;margin:10px auto 30px;padding:0 16px;color:var(--mute);font-size:.85rem;text-align:center}footer button{color:var(--mute);text-decoration:underline;margin:0 6px}
@media (max-width:560px){.feats{grid-template-columns:1fr}nav{order:3;width:100%;justify-content:space-between}nav button{flex:1;padding:8px 6px}.me{margin-left:auto}}
@media (prefers-reduced-motion:reduce){.art span{animation:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Mela<i>.</i></div>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" data-tab="feed">Feed</button><button role="tab" data-tab="reels">Reels</button><button role="tab" data-tab="videos">Videos</button>
  </nav>
  <div class="row me" id="me" style="margin:0"></div>
</header>
<main id="view"></main>
<footer>© 2026 Mela · <button data-info="about">About</button><button data-info="privacy">Privacy</button><button data-info="terms">Terms</button></footer>
<div id="bnav"><button data-tab="feed"><span>⌂</span>Home</button><button data-tab="videos"><span>▶</span>Videos</button><button class="plus" data-act="create" aria-label="Create">+</button><button data-tab="reels"><span>♪</span>Reels</button><button data-tab="profile"><span>☺</span>Profile</button></div>
<dialog id="cmDlg" class="sheet"><div class="row" style="justify-content:space-between;margin-top:0"><b id="cmT"></b><form method="dialog"><button class="ghost">Close</button></form></div><div class="cmts" id="cmL" style="max-height:50vh;overflow:auto;border:0;padding:0"></div></dialog>
<dialog id="shDlg" class="sheet"><b>Share to</b><div class="row" id="shL"></div><form method="dialog"><button class="ghost">Close</button></form></dialog>
<dialog id="infoDlg"><h2 id="infoT"></h2><p id="infoB"></p><form method="dialog"><button class="btn">Close</button></form></dialog>

<dialog id="authDlg">
  <h2 id="authTitle">Log in</h2>
  <input id="aName" placeholder="Username" autocomplete="username" hidden>
  <input id="aEmail" type="email" placeholder="Email" autocomplete="email">
  <input id="aPass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <button class="btn" id="aGoogle" style="width:100%;background:#fff;color:#2a1838;border:1px solid var(--line);margin-bottom:6px">Continue with Google</button><p style="text-align:center;color:var(--mute);margin:4px 0 10px;font-size:.85rem">or use email</p>
  <div class="row" style="justify-content:space-between"><button class="ghost" id="aSwitch">Create an account</button><span><button class="ghost" id="aCancel">Cancel</button> <button class="btn" id="aGo">Log in</button></span></div>
</dialog>
<dialog id="newDlg">
  <h2>Create</h2>
  <select id="nKind" aria-label="Type"><option value="post">Post</option><option value="reel">Reel (short)</option><option value="video">Video</option></select>
  <input id="nTitle" placeholder="Title (for videos)">
  <textarea id="nBody" rows="4" placeholder="Share what’s on your mind…"></textarea>
  <input id="nFile" type="file" accept="image/*,video/*" aria-label="Photo or video (up to 50 MB)">
  <div class="row" style="justify-content:flex-end"><button class="ghost" id="nCancel">Cancel</button><button class="btn" id="nGo">Publish</button></div>
</dialog>

<script>
const SUPABASE_URL='https://fknsfzecwtdchhtskidf.supabase.co';
const SUPABASE_KEY='sb_publishable_wFrgYQICiJ9ZSby-XY9lSQ_bYWZ1uH_';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const COLORS=['#ff8a00','#0f8b7f','#c2185b','#5b3fd1','#d1a400','#1b6fd1'];
const GRAD=[['#ff8a00','#c2185b','#5b3fd1'],['#0f8b7f','#1b6fd1','#2a1838'],['#d1a400','#ff8a00','#c2185b'],['#5b3fd1','#0f8b7f','#ff8a00'],['#c2185b','#2a1838','#1b6fd1'],['#1b6fd1','#34d1c0','#d1a400']];
const $=s=>document.querySelector(s),view=$('#view');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rtab='foryou',user=null,me=null,follows=[],pid=null,q='',posts=[],tab='feed',watching=null,signup=false;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function ago(d){const s=(Date.now()-new Date(d))/1000;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'}
function art(g){const c=GRAD[g%6];return `<div class="art" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><span style="width:55%;aspect-ratio:1;left:-8%;top:-10%;background:${c[2]};opacity:.55"></span><span style="width:40%;aspect-ratio:1;right:-6%;bottom:-8%;background:${c[0]};opacity:.7;animation-delay:-3s"></span></div>`}
function mh(p,reel){if(p.media_url){if(p.media_type==='video')return `<video src="${esc(p.media_url)}" ${reel?'autoplay muted loop':'controls'} playsinline preload="metadata"></video>`;return `<img src="${esc(p.media_url)}" alt="Photo by ${esc(p.profiles?.username)}" loading="lazy">`}return art(p.theme)}
function av(p){const n=p?.username||'?';if(p?.avatar_url)return `<img class="av" src="${esc(p.avatar_url)}" alt="${esc(n)}">`;return `<div class="av" style="background:${COLORS[(p?.color||0)%6]}">${esc(n[0].toUpperCase())}</div>`}
function likeBtn(p){const on=user&&p.likes.some(l=>l.user_id===user.id);return `<button class="${on?'on':''}" data-like="${p.id}" aria-pressed="${on}">${on?'♥':'♡'} ${p.likes.length}</button>`}

async function load(){
 const {data,error}=await sb.from('posts').select('*,profiles!posts_user_id_fkey(id,username,color,avatar_url,bio),likes(user_id),comments(id,body,created_at,profiles!comments_user_id_fkey(username))').order('created_at',{ascending:false}).limit(80);
 if(error){view.innerHTML=`<p class="empty">Couldn’t load posts: ${esc(error.message)}</p>`;return}
 posts=data;const f=await sb.from('follows').select('follower_id,following_id');follows=f.data||[];render();
}
function topbar(){
 $('#me').innerHTML=user?`<button class="ghost" data-tab="profile" style="display:flex;gap:8px;align-items:center;padding:4px 12px 4px 4px" aria-label="My profile">${av(me)}<b>${esc(me?.username||'')}</b></button><button class="pill" id="create">+ Create</button><button class="ghost" id="logout">Log out</button>`:`<button class="ghost" id="login">Log in</button><button class="pill" id="signupBtn">Sign up</button>`;
}
function cmtHtml(p){return `<div class="cmts" hidden>${p.comments.map(c=>`<p><b>${esc(c.profiles?.username||'User')}</b> ${esc(c.body)}</p>`).join('')}<form data-form="${p.id}"><input placeholder="Write a comment…" aria-label="Comment" required maxlength="500"><button class="btn">Send</button></form></div>`}
function renderFeed(){view.className='';const l=posts.filter(p=>p.kind==='post'&&(!q||(p.body+' '+(p.profiles?.username||'')).toLowerCase().includes(q)));
 view.innerHTML=heroHtml()+`<input id="search" placeholder="Search posts and people…" aria-label="Search" value="${esc(q)}" style="margin-bottom:14px">`+(l.length?l.map(p=>`<article class="card"><div class="ph"><button data-prof="${p.user_id}" style="display:flex;gap:10px;align-items:center;text-align:left" aria-label="Open profile">${av(p.profiles)}<span><b style="display:block;line-height:1.1">${esc(p.profiles?.username)}</b><small style="color:var(--mute)">${ago(p.created_at)}</small></span></button>${user&&p.user_id===user.id?`<button class="ghost" data-del="${p.id}" style="margin-left:auto" aria-label="Delete post">Delete</button>`:''}</div><div class="txt">${esc(p.body)}</div><div class="media">${mh(p)}</div><div class="acts">${likeBtn(p)}<button data-cm>💬 ${p.comments.length}</button><button data-share="${p.id}">↗ Share</button></div>${cmtHtml(p)}</article>`).join(''):`<p class="empty">${q?'No results.':'No posts yet. Log in and tap + Create to share the first one.'}</p>`)}
function heroHtml(){return user?'':`<section class="hero"><h1>Share moments.<br>Watch reels. Build your community.</h1><p>Mela brings posts, short reels and videos together in one friendly place.</p><button class="pill" data-auth="signup">Join free</button> <button class="ghost" data-auth="login">Log in</button></section><div class="feats"><div><b>Posts</b>Share updates with photos</div><div><b>Reels</b>Short vertical videos</div><div><b>Videos</b>Longer videos to watch</div></div>`}
function renderReels(){view.className='';
 const l=posts.filter(p=>p.kind==='reel'&&(rtab==='foryou'||(user&&follows.some(f=>f.follower_id===user.id&&f.following_id===p.user_id))));
 const tabs=`<div class="tabs2"><button data-tab="feed" aria-label="Back" style="position:absolute;left:12px;opacity:1">←</button><button data-rtab="following" class="${rtab==='following'?'on':''}">Following</button><button data-rtab="foryou" class="${rtab==='foryou'?'on':''}">For You</button></div>`;
 view.innerHTML=`<div class="ttw">${tabs}`+(l.length?`<div class="reels">${l.map(p=>{const on=user&&p.likes.some(x=>x.user_id===user.id),fol=user&&follows.some(f=>f.follower_id===user.id&&f.following_id===p.user_id),own=user&&p.user_id===user.id;
  return `<section class="reel" data-reel>${mh(p,1)}<div class="shade"></div><div class="cap"><b>@${esc(p.profiles?.username)}</b><div>${esc(p.body)}</div></div><div class="side"><div class="avb"><button data-prof="${p.user_id}" aria-label="Profile">${av(p.profiles)}</button>${own||fol?'':`<button class="fplus" data-follow="${p.user_id}" aria-label="Follow">+</button>`}</div><button data-like="${p.id}" class="${on?'liked':''}" aria-pressed="${!!on}"><span class="ic">${on?'♥':'♡'}</span>${p.likes.length}</button><button data-cmsheet="${p.id}"><span class="ic">💬</span>${p.comments.length}</button><button data-sharesheet="${p.id}"><span class="ic">↗</span>Share</button></div></section>`}).join('')}</div>`:`<p class="empty" style="color:#aaa;padding-top:40vh">${rtab==='following'?'Follow people to see their reels here.':'No reels yet. Tap + to create the first one.'}</p>`)+`</div>`;
 watchReels()}
function watchReels(){const io=new IntersectionObserver(es=>es.forEach(en=>{const v=en.target.querySelector('video');if(!v)return;en.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.6});document.querySelectorAll('[data-reel]').forEach(r=>io.observe(r))}
function openSheet(id){const p=posts.find(x=>x.id===id);if(!p)return;$('#cmT').textContent=p.comments.length+' comments';
 $('#cmL').innerHTML=(p.comments.map(c=>`<p><b>${esc(c.profiles?.username||'User')}</b> ${esc(c.body)}</p>`).join('')||'<p style="color:var(--mute)">No comments yet. Be the first.</p>')+`<form data-form="${id}"><input placeholder="Add comment…" aria-label="Comment" required maxlength="500"><button class="btn">Post</button></form>`;
 if(!$('#cmDlg').open)$('#cmDlg').showModal()}
function openShare(){const u=encodeURIComponent(location.href.split('#')[0]);
 $('#shL').innerHTML=`<button class="btn" data-copy="1">Copy link</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${u}">WhatsApp</a><a class="btn" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${u}">Facebook</a><a class="btn" target="_blank" rel="noopener" href="https://t.me/share/url?url=${u}">Telegram</a>`;$('#shDlg').showModal()}
function renderVideos(){view.className='wide';
 if(watching){const p=posts.find(x=>x.id===watching);if(p){view.innerHTML=`<div style="max-width:860px;margin:0 auto"><button class="btn" data-back>← All videos</button><div class="media" style="border-radius:16px;margin-top:12px">${mh(p)}</div><h2 style="margin:12px 0 4px">${esc(p.title||'Untitled')}</h2><small style="color:var(--mute)">${ago(p.created_at)} ago</small><p style="white-space:pre-wrap">${esc(p.body)}</p><div class="row">${av(p.profiles)}<b>${esc(p.profiles?.username)}</b><span style="margin-left:auto"></span>${likeBtn(p)}</div><article class="card">${cmtHtml(p).replace('hidden','')}</article></div>`;return}watching=null}
 const l=posts.filter(p=>p.kind==='video');
 view.innerHTML=l.length?`<div class="grid">${l.map(p=>`<button class="vid" data-open="${p.id}"><div class="media">${mh(p)}</div><h3>${esc(p.title||'Untitled')}</h3><small>${esc(p.profiles?.username)} · ${ago(p.created_at)} ago</small></button>`).join('')}</div>`:`<p class="empty">No videos yet. Create the first one.</p>`}
function profOf(id){if(user&&id===user.id)return me;const x=posts.find(p=>p.user_id===id);return x?x.profiles:null}
function renderProfile(){view.className='';const id=pid||user?.id;
 if(!id){view.innerHTML='<p class="empty">Log in to see your profile.</p>';return}
 const pr=profOf(id);if(!pr){view.innerHTML='<p class="empty">Profile not found.</p>';return}
 const own=user&&id===user.id,mine=posts.filter(p=>p.user_id===id),lk=mine.reduce((n,p)=>n+p.likes.length,0);
 const fers=follows.filter(f=>f.following_id===id).length,fing=follows.filter(f=>f.follower_id===id).length;
 const isF=user&&follows.some(f=>f.follower_id===user.id&&f.following_id===id),c=GRAD[(pr.color||0)%6];
 const ava=pr.avatar_url?`<img class="av pav" src="${esc(pr.avatar_url)}" alt="${esc(pr.username)}">`:`<div class="av pav" style="background:${COLORS[(pr.color||0)%6]}">${esc(pr.username[0].toUpperCase())}</div>`;
 view.innerHTML=`<div class="card"><div class="cover" style="background:linear-gradient(135deg,${c[0]},${c[1]},${c[2]})"></div><div class="pbox">${ava}<h2 style="margin:8px 0 2px">${esc(pr.username)}</h2><p style="margin:0;white-space:pre-wrap;color:var(--mute)">${esc(pr.bio||(own?'Add a short bio below.':''))}</p><div class="stats"><span><b>${mine.length}</b> posts</span><span><b>${fers}</b> followers</span><span><b>${fing}</b> following</span><span><b>${lk}</b> likes</span></div>
 ${own?`<input id="pName" value="${esc(pr.username)}" maxlength="30" aria-label="Username" style="margin-bottom:8px"><textarea id="pBio" rows="2" maxlength="200" placeholder="Short bio (200 characters)" aria-label="Bio" style="margin-bottom:8px">${esc(pr.bio||'')}</textarea><label style="display:block;margin-bottom:8px;color:var(--mute);font-size:.9rem">Profile photo: <input id="pFile" type="file" accept="image/*"></label><button class="btn" id="pSave">Save profile</button>`:`<button class="btn" data-follow="${id}">${isF?'Following ✓':'Follow'}</button>`}</div></div>`
 +(mine.length?mine.map(p=>`<article class="card"><div class="txt" style="padding-top:12px">${esc(p.title?p.title+' — ':'')}${esc(p.body)}</div>${p.media_url?`<div class="media">${mh(p)}</div>`:''}<div class="acts"><button disabled>♥ ${p.likes.length}</button><button disabled>💬 ${p.comments.length}</button>${own?`<button data-del="${p.id}" style="margin-left:auto">Delete</button>`:''}</div></article>`).join(''):'<p class="empty">No posts yet.</p>')}
const INFO={about:['About Mela','Mela is a friendly place to share posts, reels and videos with your community.'],privacy:['Privacy','We store your email, username, profile and the content you share. Posts, reels, videos and profiles are public. You can delete your own posts any time.'],terms:['Terms','Be kind and respectful. Do not post illegal, harmful or hateful content. Content that breaks these rules may be removed.']};
function render(){topbar();document.body.classList.toggle('tt',tab==='reels');document.querySelectorAll('#bnav [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));({feed:renderFeed,reels:renderReels,videos:renderVideos,profile:renderProfile})[tab]()}
function needLogin(){if(user)return false;openAuth(false);toast('Log in first');return true}
function openAuth(s){signup=s;$('#authTitle').textContent=s?'Create account':'Log in';$('#aName').hidden=!s;$('#aGo').textContent=s?'Sign up':'Log in';$('#aSwitch').textContent=s?'I have an account':'Create an account';$('#authDlg').showModal()}

document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.tab){tab=d.tab;watching=null;pid=null;render();scrollTo(0,0)}
 else if(d.prof){pid=d.prof;tab='profile';render();scrollTo(0,0)}
 else if(d.auth)openAuth(d.auth==='signup')
 else if(d.rtab){rtab=d.rtab;render()}
 else if(d.act==='create'){if(!needLogin())$('#newDlg').showModal()}
 else if(d.cmsheet)openSheet(d.cmsheet)
 else if(d.sharesheet)openShare()
 else if(d.copy){try{navigator.clipboard.writeText(location.href.split('#')[0])}catch(x){}toast('Link copied');$('#shDlg').close()}
 else if(d.info){$('#infoT').textContent=INFO[d.info][0];$('#infoB').textContent=INFO[d.info][1];$('#infoDlg').showModal()}
 else if(d.follow){if(needLogin())return;const fid=d.follow,on=follows.some(f=>f.follower_id===user.id&&f.following_id===fid);
  if(on){follows=follows.filter(f=>!(f.follower_id===user.id&&f.following_id===fid));render();await sb.from('follows').delete().match({follower_id:user.id,following_id:fid})}
  else{follows.push({follower_id:user.id,following_id:fid});render();await sb.from('follows').insert({follower_id:user.id,following_id:fid})}}
 else if(d.like){if(needLogin())return;const p=posts.find(x=>x.id===d.like),on=p.likes.some(l=>l.user_id===user.id);
  if(on){p.likes=p.likes.filter(l=>l.user_id!==user.id);render();await sb.from('likes').delete().match({post_id:p.id,user_id:user.id})}
  else{p.likes.push({user_id:user.id});render();await sb.from('likes').insert({post_id:p.id,user_id:user.id})}}
 else if('cm' in d){const c=t.closest('article').querySelector('.cmts');c.hidden=!c.hidden}
 else if(d.share){try{navigator.clipboard.writeText(location.href.split('#')[0])}catch(x){}toast('Link copied')}
 else if(d.open){watching=d.open;render();scrollTo(0,0)}
 else if('back' in d){watching=null;render()}
 else if(d.del){if(confirm('Delete this post?')){await sb.from('posts').delete().eq('id',d.del);load()}}
 else if(t.id==='login')openAuth(false);else if(t.id==='signupBtn')openAuth(true);
 else if(t.id==='logout'){await sb.auth.signOut()}
 else if(t.id==='create'){$('#newDlg').showModal()}
 else if(t.id==='aGoogle'){const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(r.error)toast(r.error.message)}
 else if(t.id==='pSave'){const name=$('#pName').value.trim(),bio=$('#pBio').value.trim(),f=$('#pFile').files[0];
  if(name.length<2){toast('Name is too short');return}if(f&&f.size>5242880){toast('Photo must be under 5 MB');return}
  t.disabled=true;t.textContent='Saving…';const upd={username:name,bio:bio||null};
  if(f){const path=`${user.id}/avatar-${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('media').upload(path,f,{contentType:f.type});
   if(up.error){toast(up.error.message);t.disabled=false;t.textContent='Save profile';return}upd.avatar_url=sb.storage.from('media').getPublicUrl(path).data.publicUrl}
  const {error}=await sb.from('profiles').update(upd).eq('id',user.id);t.disabled=false;t.textContent='Save profile';
  if(error){toast(error.message);return}Object.assign(me,upd);await load();toast('Profile saved')}
 else if(t.id==='aSwitch')openAuth(!signup);else if(t.id==='aCancel')$('#authDlg').close();
 else if(t.id==='nCancel')$('#newDlg').close();
 else if(t.id==='aGo'){
  const email=$('#aEmail').value.trim(),password=$('#aPass').value,username=$('#aName').value.trim();
  if(!email||password.length<6||(signup&&username.length<2)){toast('Fill every field (password 6+ characters)');return}
  t.disabled=true;
  const r=signup?await sb.auth.signUp({email,password,options:{data:{username}}}):await sb.auth.signInWithPassword({email,password});
  t.disabled=false;
  if(r.error){toast(r.error.message);return}
  $('#authDlg').close();
  if(signup&&!r.data.session)toast('Check your email to confirm your account');
 }
 else if(t.id==='nGo'){
  const body=$('#nBody').value.trim();if(!body){toast('Write something first');return}
  const kind=$('#nKind').value,title=$('#nTitle').value.trim()||null;
  const f=$('#nFile').files[0];let media_url=null,media_type=null;
  if(f&&f.size>52428800){toast('File is over 50 MB');return}
  t.disabled=true;t.textContent='Publishing…';
  if(f){const path=`${user.id}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
   const up=await sb.storage.from('media').upload(path,f,{contentType:f.type});
   if(up.error){toast(up.error.message);t.disabled=false;t.textContent='Publish';return}
   media_url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;media_type=f.type.startsWith('video')?'video':'image'}
  const {error}=await sb.from('posts').insert({user_id:user.id,kind,title,body,media_url,media_type,theme:Math.floor(Math.random()*6)});
  t.disabled=false;t.textContent='Publish';if(error){toast(error.message);return}
  $('#nFile').value='';$('#nBody').value='';$('#nTitle').value='';$('#newDlg').close();tab=kind==='post'?'feed':kind==='reel'?'reels':'videos';watching=null;await load();toast('Published');
 }
});
document.addEventListener('submit',async e=>{
 const id=e.target.dataset.form;if(!id)return;e.preventDefault();if(needLogin())return;
 const i=e.target.querySelector('input'),body=i.value.trim();if(!body)return;
 const {error}=await sb.from('comments').insert({post_id:id,user_id:user.id,body});
 if(error){toast(error.message);return}
 i.value='';await load();if($('#cmDlg').open)openSheet(id);const a=[...document.querySelectorAll('[data-form]')].find(f=>f.dataset.form===id);if(a)a.closest('.cmts').hidden=false;
});
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value.toLowerCase();const pos=e.target.selectionStart;renderFeed();const i=$('#search');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('click',e=>{const r=e.target.closest('[data-reel]');if(!r||e.target.closest('button'))return;const v=r.querySelector('video');if(!v)return;if(v.muted)v.muted=false;else v.paused?v.play():v.pause()});
async function setUser(session){
 user=session?.user||null;me=null;
 if(user){const {data}=await sb.from('profiles').select('id,username,color,avatar_url,bio').eq('id',user.id).single();me=data}
 await load();
}
sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>setUser(s),0)});
sb.auth.getSession().then(({data})=>setUser(data.session));
setInterval(()=>{if(!document.hidden&&!document.querySelector('dialog[open]')&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))load()},20000);
</script>
</body>
</html>
